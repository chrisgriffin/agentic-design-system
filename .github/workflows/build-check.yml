name: Build Check

# Thin trigger stub: the job body (checkout, Node, install, run the chain) is
# the public chrisgriffin/workflows repo's _reusable-node-ci.yml, pinned to
# its `v1` tag. The job reports as `build / ci`, the check both branch
# rulesets require by that name; rename it here and the ruleset edit lands
# first, or every PR blocks on a check that can no longer report.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    permissions:
      contents: read
      # The callee declares `packages: read`; a callee asking above the
      # caller's ceiling fails the run outright. Inert: nothing private is
      # installed.
      packages: read
    uses: chrisgriffin/workflows/.github/workflows/_reusable-node-ci.yml@v1
    with:
      node_version: "22"
      claude_md_budget: "8500"
      docs_owed: ""
      docs_only_paths: docs/** .github/CODEOWNERS
      run: npm run verify
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
