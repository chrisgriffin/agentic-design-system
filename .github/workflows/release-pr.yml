name: Release PR

# Thin stub: every push to develop keeps one rolling release/next PR into
# main up to date, from the Conventional Commits since the last tag. The body
# is the public chrisgriffin/workflows repo's _reusable-release-pr.yml at v1.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  release-pr:
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: chrisgriffin/workflows/.github/workflows/_reusable-release-pr.yml@v1
    secrets:
      RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
      OPS_GH_TOKEN: ${{ secrets.OPS_GH_TOKEN }}
