name: Create GitHub Release

# Thin stub: merging release/next into main tags vX.Y.Z and creates the
# GitHub Release from that version's CHANGELOG.md entry. It passes no build
# command, no assets and no registry, so it builds, attaches and publishes
# nothing.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: chrisgriffin/workflows/.github/workflows/_reusable-create-github-release.yml@v1
