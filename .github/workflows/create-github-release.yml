name: Create GitHub Release

# Thin stub: merging release/next into main tags vX.Y.Z and creates the
# GitHub Release from that version's CHANGELOG.md entry. The template is a
# private package, so nothing is built, attached or published.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: chrisgriffin/workflows/.github/workflows/_reusable-create-github-release.yml@v1
