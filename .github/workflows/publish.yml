name: Publish to npm

# Publishes the create command to the public npm registry as
# create-agentic-ds, the package `npm create agentic-ds` runs, with the
# NPM_TOKEN secret: when a release/* or hotfix/* PR merges into main, beside
# create-github-release.yml, and by hand from the Actions tab on main, to
# retry a publish that failed. A version the registry already has is skipped,
# green, so a retry and a hotfix that bumped nothing are both safe.
#
# A file of its own, not inputs on create-github-release.yml:
# scripts/init.mjs removes this file from a copy, so a created system keeps a
# release stub that publishes nothing.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The run's ID token signs the provenance statement npm attaches.
  id-token: write

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: ubuntu-latest
    # Runaway cap: without it a hung `npm publish` inherits GitHub's 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The merge commit on main, which holds the released version.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on the registry. Skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
