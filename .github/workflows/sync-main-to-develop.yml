name: Sync main to develop

# Thin stub: after a release, main merges back into develop, or a sync PR
# opens when it cannot.

on:
  push:
    branches: [main]

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: chrisgriffin/workflows/.github/workflows/_reusable-sync-main-to-develop.yml@v1
    secrets:
      RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
